<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background: Dark Graphite/Black -->
  <rect width="400" height="400" fill="#121212" />
  
  <!-- Subtle Grid -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a1a1a" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8e8e8e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a4a4a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffcc00;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffcc00;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#grid)" />

  <!-- Hexagonal Shield Shape -->
  <path d="M 200 40 L 340 120 L 340 280 L 200 360 L 60 280 L 60 120 Z" fill="#1a1a1a" stroke="url(#titanium)" stroke-width="4" />
  
  <!-- Inner Geometry/Circuit Traces -->
  <path d="M 200 60 L 320 130 L 320 270 L 200 340 L 80 270 L 80 130 Z" fill="none" stroke="#333" stroke-width="1" />
  <path d="M 200 40 L 200 360 M 60 120 L 340 280 M 340 120 L 60 280" stroke="#222" stroke-width="0.5" opacity="0.5" />

  <!-- Central AI/Core Symbol (Geometric Minimal) -->
  <circle cx="200" cy="180" r="35" fill="none" stroke="#ffcc00" stroke-width="2" />
  <circle cx="200" cy="180" r="25" fill="none" stroke="#ffcc00" stroke-width="1" opacity="0.5" />
  <path d="M 200 145 L 215 180 L 200 215 L 185 180 Z" fill="#ffcc00" />
  <circle cx="200" cy="180" r="8" fill="#121212" />
  <circle cx="200" cy="180" r="3" fill="#ffcc00" />
  
  <!-- Core Glow -->
  <circle cx="200" cy="180" r="50" fill="url(#coreGlow)" />

  <!-- Text: ANACLETO -->
  <text x="200" y="305" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">ANACLETO</text>
  
  <!-- Text: SOVEREIGN AGENT -->
  <text x="200" y="335" font-family="sans-serif" font-size="14" fill="#ffcc00" text-anchor="middle" letter-spacing="2">SOVEREIGN AGENT</text>

  <!-- Technical Accents (Corner details) -->
  <path d="M 70 130 L 90 130 M 70 130 L 70 150" stroke="#ffcc00" stroke-width="1" fill="none" />
  <path d="M 330 270 L 310 270 M 330 270 L 330 250" stroke="#ffcc00" stroke-width="1" fill="none" />
</svg>
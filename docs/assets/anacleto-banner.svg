<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <!-- Background: Dark Graphite -->
  <rect width="1200" height="400" fill="#121212" />
  
  <!-- Subtle Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8e8e8e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a4a4a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Main Content Container -->
  <g transform="translate(600, 200)">
    
    <!-- Primary Title: ANACLETO -->
    <text x="0" y="-40" font-family="sans-serif" font-weight="900" font-size="100" fill="#ffffff" text-anchor="middle" letter-spacing="10">ANACLETO</text>
    
    <!-- Secondary Title: SOVEREIGN AGENT -->
    <text x="0" y="30" font-family="sans-serif" font-weight="bold" font-size="35" fill="#ffcc00" text-anchor="middle" letter-spacing="8">SOVEREIGN AGENT</text>
    
    <!-- Separator Line -->
    <line x1="-300" y1="60" x2="300" y2="60" stroke="#4a4a4a" stroke-width="2" opacity="0.5" />

    <!-- Tertiary Text: LOCAL-FIRST · AUTONOMOUS · VERIFIABLE -->
    <text x="0" y="100" font-family="sans-serif" font-size="22" fill="#cccccc" text-anchor="middle" letter-spacing="3">LOCAL-FIRST · AUTONOMOUS · VERIFIABLE</text>
    
    <!-- Technical Text: GEMMA 4 · llama.cpp · CUDA · NVIDIA -->
    <text x="0" y="140" font-family="monospace" font-size="16" fill="#8e8e8e" text-anchor="middle">GEMMA 4 · llama.cpp · CUDA · NVIDIA</text>
    
    <!-- Hardware Text: 3 × RTX 3060 · 36 GB VRAM -->
    <text x="0" y="170" font-family="monospace" font-size="16" fill="#ffcc00" text-anchor="middle" opacity="0.8">3 × RTX 3060 · 36 GB VRAM</text>

  </g>

  <!-- Decorative Elements: Technical Border/Accents -->
  <rect x="10" y="10" width="1180" height="380" fill="none" stroke="#333" stroke-width="2" opacity="0.3" />
  <path d="M 10 10 L 50 10 M 10 10 L 10 50" stroke="#ffcc00" stroke-width="4" fill="none" />
</svg>
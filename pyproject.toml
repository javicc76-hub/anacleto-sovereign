[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anacleto-sovereign"
version = "0.6.0"
description = "Sovereign AI Agent with Cyberpunk TUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "curses",
    "textwrap",
    "dataclasses",
]

[project.scripts]
anacleto-tui = "anacleto_sovereign.tui:main"

[tool.setuptools.packages.find]
where = ["src"]
